openapi: 3.1.0
info:
  title: Aplicación CMS - API y rutas web
  version: 1.0.0
  description: >-
    Especificación generada desde routes/api.php y routes/web.php. Las rutas web son principalmente HTML con sesión; consulte README.md para el flujo CSRF y limitaciones.
servers:
  - url: http://127.0.0.1:8000
tags:
  - name: "API - JSON y Bearer"
  - name: "Web - Público"
  - name: "Web - Autenticación (sesión + CSRF)"
  - name: "Web - Recuperación OTP (sesión + CSRF)"
  - name: "Web - Administración (sesión + CSRF)"
paths:
  "/api/login":
    post:
      tags:
        - "API - JSON y Bearer"
      operationId: "_api_login"
      summary: "/api/login"
      description: "Ruta API JSON. Nombre Laravel: . API bajo /api; enviar Accept: application/json. Login entrega token Bearer."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Successful JSON response }
        '401': { description: Unauthenticated or invalid credentials }
        '403': { description: Authenticated but not authorized }
  "/api/dashboard":
    get:
      tags:
        - "API - JSON y Bearer"
      operationId: "_api_dashboard"
      summary: "/api/dashboard"
      description: "Ruta API JSON. Nombre Laravel: . API bajo /api; enviar Accept: application/json. Login entrega token Bearer."
      security:
        - bearerAuth: []
      responses:
